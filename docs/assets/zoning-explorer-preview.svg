<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Gridics Zoning Explorer preview</title>
<desc id="desc">Illustrative interface with property search, parcel facts, zoning district, setbacks, height and development-capacity panels.</desc>
